<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Data Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1>Student Performance</h1>

    <canvas id="myChart"></canvas>

    <script>
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['DBMS', 'Java', 'DS', 'DSGT', 'Web'],
                datasets: [{
                    label: 'Marks',
                    data: [75, 82, 68, 78, 88],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>
</html>
